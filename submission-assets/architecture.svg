<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="520" viewBox="0 0 1320 520" role="img" aria-labelledby="title desc"><title id="title">A11yForge: Find it. Fix it. Prove it.</title><desc id="desc">Deterministic browser evidence grounds Meta diagnosis and repair. Build, replay and regression checks reject failed repairs. One bounded revision is allowed. Passing repairs go to an eligible critic before acceptance.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#b5b2aa" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#f5f2ea}.small{font-size:13px;fill:#b5b2aa}.heading{font-size:18px;font-weight:700}.edge{fill:none;stroke:#b5b2aa;stroke-width:2;marker-end:url(#arrow)}.box{fill:#141416;stroke:#57565b;stroke-width:1.5;rx:10}.ai{stroke:#ff765f}</style><rect width="1320" height="520" fill="#0b0b0d"/><text x="30" y="55" font-size="32" font-weight="700">A11yForge</text><text x="30" y="90" font-size="22">Find it. Fix it. Prove it.</text><text x="790" y="75" class="small">Meta reasons. Deterministic tools establish facts and proof.</text><rect class="box " x="30" y="150" width="190" height="100"/><text class="heading" x="42" y="182">1. Browser</text><text class="small" x="42" y="212">Playwright, axe, keyboard</text><path class="edge" d="M220,200 H235"/><rect class="box " x="240" y="150" width="190" height="100"/><text class="heading" x="252" y="182">2. Evidence</text><text class="small" x="252" y="212">Screenshots + checks</text><path class="edge" d="M430,200 H445"/><rect class="box ai" x="450" y="150" width="190" height="100"/><text class="heading" x="462" y="182">3. Meta diagnosis</text><text class="small" x="462" y="212">Structured reasoning</text><path class="edge" d="M640,200 H655"/><rect class="box " x="660" y="150" width="190" height="100"/><text class="heading" x="672" y="182">4. Source trace</text><text class="small" x="672" y="212">Measured identifiers</text><path class="edge" d="M850,200 H865"/><rect class="box ai" x="870" y="150" width="190" height="100"/><text class="heading" x="882" y="182">5. Meta repair</text><text class="small" x="882" y="212">Small exact-anchor proposal</text><path class="edge" d="M1060,200 H1075"/><rect class="box " x="1080" y="150" width="190" height="100"/><text class="heading" x="1092" y="182">6. Check + replay</text><text class="small" x="1092" y="212">Build, replay, axe</text><path class="edge" d="M1175,250 V310"/><text x="1186" y="284" class="small">PASS</text><rect class="box ai" x="1080" y="320" width="190" height="70"/><text class="heading" x="1092" y="348">Meta critic</text><text class="small" x="1092" y="371">Eligible passing repairs only</text><path class="edge" d="M1080,355 H1000"/><rect class="box" x="750" y="320" width="240" height="70"/><text class="heading" x="766" y="348">Verified repair accepted</text><text class="small" x="766" y="371">Proof scoped to tested behavior</text><path class="edge" d="M1130,250 V285 H965 V250"/><text class="small" x="580" y="280">FAIL → verifier evidence → one Meta revision → check again</text><rect class="box" x="30" y="320" width="580" height="70"/><text class="heading" x="46" y="348">Still fails or cannot reproduce? Reject / unverifiable.</text><text class="small" x="46" y="371">The model cannot override a failed deterministic gate.</text><text class="small" x="30" y="455">Exploration: 0 AI calls. Complete controlled repair: at most 4 calls. Exactly one revision available.</text><text class="small" x="30" y="482">Full autonomous repair is demonstrated on the controlled fixture. Arbitrary hosted code mutation is disabled.</text></svg>
